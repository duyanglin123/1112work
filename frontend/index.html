<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskBoard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <p class="eyebrow">Cloud Seminar · 3-service app</p>
      <h1>TaskBoard</h1>
      <p class="subtitle">A tiny task list backed by FastAPI and Redis.</p>
    </section>

    <section class="card composer">
      <form id="task-form">
        <label for="title">New task</label>
        <div class="composer-row">
          <input id="title" name="title" maxlength="120" placeholder="e.g. Record the deployment demo" required>
          <button type="submit">Add task</button>
        </div>
      </form>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="card">
      <div class="list-heading">
        <h2>Tasks</h2>
        <span id="count" class="count">0</span>
      </div>
      <ul id="task-list" class="task-list"></ul>
      <p id="empty" class="empty">No tasks yet. Add one above.</p>
    </section>
    <footer>Frontend: Blob Storage static website · API: Container Apps · Data: Redis</footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
